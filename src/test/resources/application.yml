spring:
  datasource:
    url: jdbc:h2:mem:wifi_monitor;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    enabled: false

wifi:
  monitor:
    enabled: false
    interval-ms: 5000
    command-timeout-ms: 1000
    ping-count: 1
    ping-timeout-ms: 200
    internet-hosts:
      - 8.8.8.8
    dns-hosts:
      - localhost
    signal-low-threshold-percent: 40
    signal-recover-threshold-percent: 50
